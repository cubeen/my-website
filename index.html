---
layout: default
title: Home Page
---

<h1>Welcome to My Jekyll Site</h1>
<p>Here are my latest posts:</p>

<ul>
  {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <span>- {{ post.date | date: "%B %d, %Y" }}</span>
    </li>
  {% endfor %}
</ul>
